name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Bossnet Proceduri v__VERSION__"
          releaseBody: |
            Bossnet Proceduri pentru Windows.

            - Login mock @bossnet.ro cu sesiune 24h
            - Dashboard Proiect nou / Proiecte existente
            - Overlay transparent configurabil
            - Icon app, taskbar și system tray

            Installer nesemnat: Windows SmartScreen poate afișa Unknown publisher.
          releaseDraft: false
          prerelease: false
