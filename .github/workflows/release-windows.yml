name: Release Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    env:
      # OAuth Desktop Client IDs are public identifiers embedded in installed apps.
      VITE_GOOGLE_CLIENT_ID: 1069295886840-j89jtq5he9i5tjlhjg4sfv0sr6nbt0dg.apps.googleusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Require Google Desktop Client ID
        shell: bash
        run: |
          test -n "$VITE_GOOGLE_CLIENT_ID"
          [[ "$VITE_GOOGLE_CLIENT_ID" == *.apps.googleusercontent.com ]]

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_BOSSNET_API_URL: https://proceduri.teambossnet.ro
          VITE_ENABLE_MOCK_AUTH: "false"
        with:
          tagName: v__VERSION__
          releaseName: "Bossnet Proceduri v__VERSION__"
          releaseBody: |
            Bossnet Proceduri pentru Windows.

            - Notificări Windows trimise și confirmate prin comandă Rust nativă, stabile după repornirea aplicației
            - Test de notificare cu diagnostic explicit atunci când Windows blochează toast-ul
            - Login simplificat: PROCEDURI INTERNE, Last update v0.4 MAHMURIA și o singură acțiune Google
            - Login Google Workspace @bossnet.ro cu PKCE, schimb de cod securizat în API și sesiune de 24h
            - Feedback distinct pentru browser, callback și conectarea la server, cu timeout-uri explicite
            - Tipografie funcțională de minimum 14 px și layout-uri responsive fără texte decupate
            - PostgreSQL nativ și API securizat, fără date personale în executabil
            - Director organizațional: utilizatori, ierarhie, departamente și telefoane
            - Dashboard Proiect nou / Proiecte existente
            - Laborator Debug cu dropdown, search, carduri și date pickers
            - Icon-uri SVG Lucide, textarea și editor WYSIWYG funcțional
            - Inputuri editabile corect în WebView2
            - Reguli overlay, opacitate, gradient și blur configurabile
            - Notificări in-app și native Windows
            - Fundal stabil, fără colțuri albe
            - Icon app, taskbar și system tray

            Installer nesemnat: Windows SmartScreen poate afișa Unknown publisher.
          releaseDraft: false
          prerelease: false
