[package]
name = "bossnet-proceduri"
version = "0.4.4"
description = "Bossnet Proceduri desktop"
authors = ["Bossnet"]
edition = "2021"

[lib]
name = "bossnet_proceduri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
open = { version = "5.4", features = ["shellexecute-on-windows"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
url = "2.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
