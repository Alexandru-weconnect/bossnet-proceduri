[package]
name = "bossnet-proceduri"
version = "0.2.0"
description = "Bossnet Proceduri desktop"
authors = ["Bossnet"]
edition = "2021"

[lib]
name = "bossnet_proceduri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
